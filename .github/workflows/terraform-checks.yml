name: Terraform checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, validate, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Prepare Terraform plugin cache
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize and validate bootstrap configuration
        run: |
          terraform -chdir=bootstrap/state init -backend=false -input=false -lockfile=readonly
          terraform -chdir=bootstrap/state validate

      - name: Test bootstrap safeguards
        run: terraform -chdir=bootstrap/state test

      - name: Initialize and validate project configuration
        run: |
          terraform -chdir=environments/project init -backend=false -input=false -lockfile=readonly
          terraform -chdir=environments/project validate

      - name: Run plan-checker regression tests
        run: python3 -m unittest discover -s tests -v
